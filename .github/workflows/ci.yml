name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so pushes don't queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: |
          set +e
          OUTPUT=$(bun run lint 2>&1)
          CODE=$?
          echo "$OUTPUT"
          echo "LINT_EXIT_CODE=$CODE"
          if [ $CODE -ne 0 ]; then
            FLAT=$(printf '%s' "$OUTPUT" | tr '\n' '|')
            printf '%s' "$FLAT" | fold -w 800 | while IFS= read -r chunk; do
              echo "::error::$chunk"
            done
            echo "::error::EXIT_CODE=$CODE"
          fi
          exit $CODE

      - name: Build
        run: bun run build
